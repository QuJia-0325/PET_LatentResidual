project_name: pet_first_hop_224

rae_root: /home/qujiaxiang/project/RAE
output_dir: /data_2/qujiaxiang/outputs/PET_LatentResidual
run_name: first_hop_224_10k_strict

seed: 42
device: cuda:1

data:
  latent_dir: /data_2/qujiaxiang/lowdose_pet_ct/latents_224
  raw_data_dir: /data_2/qujiaxiang
  clamp_max: 10.0
  image_size: 224
  num_workers: 0
  batch_size: 8
  hop0_aux_batch_size: 2
  verify_alignment: true
  alignment_check_num_samples: 16
  alignment_audit_json: /data_2/qujiaxiang/outputs/PET_LatentResidual/alignment_224_audit/alignment_224_clip3_audit.json
  train_include_x_rollout_first: true
  train_include_full_x_rollout: false
  val_include_x_rollout_first: true
  val_include_full_x_rollout: true
  rollout_timepoints: [D50, D20, D10, D4, NORMAL]
  t_map:
    D50: 2.0
    D20: 5.0
    D10: 10.0
    D4: 25.0
    NORMAL: 100.0

training:
  max_steps: 10000
  log_interval: 50
  eval_interval: 500
  save_interval: 2500
  max_val_batches: 64
  max_hop0_val_batches: 64
  amp: false
  grad_clip: 0.5
  freeze_backbone: false
  freeze_rae: true
  best_metric: val_rollout_total
  hop0_coverage_target: [0.20, 0.50]
  gate_explosion_watch_steps: 500
  gate_abs_max: 2.0
  lambda_hop0_abs_max: 2.0
  dead_branch_watch_steps: 10000
  dead_branch_patience: 120
  dead_branch_gate_eps: 5.0e-4
  dead_branch_lambda_eps: 5.0e-4
  img_loss_zero_eps: 5.0e-4
  img_loss_zero_patience: 120
  progress_bar: true
  log_grad_norms: false
  print_train_line_with_pbar: false
  metrics_jsonl: true
  rollout:
    enabled: true
    path: [D50, D20, D10, D4, NORMAL]
    warmup_steps: 400
    ramp_steps: 1600
    alpha_start: 0.0
    alpha_end: 0.90
    lambda_start: 0.05
    lambda_end: 0.25
    endpoint_loss_weight: 0.25
    loss_type: mse
    straight_through: true
    step_weights: [2.00, 1.30, 1.0, 1.0]
  image_aux:
    enabled: true
    warmup_steps: 100
    ramp_steps: 2000
    lambda_start: 0.01
    lambda_max: 0.08

optimizer:
  lr: 8.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  backbone_lr_mult: 0.5
  first_hop_lr_mult: 3.0

lr_schedule:
  enabled: true
  warmup_steps: 1000
  min_lr: 2.0e-6

transport:
  method: mean_flow
  loss_type: mse
  velocity_loss_weight: 1.0
  endpoint_loss_weight: 1.0
  endpoint_pair_weighting: true
  endpoint_dt_normalize: true
  pair_sample_probs: [0.45, 0.25, 0.15, 0.15]
  pair_weighting: manual
  pair_loss_weights: [2.00, 1.20, 1.0, 1.0]

backbone:
  checkpoint_path: /data_2/qujiaxiang/outputs/pet_flow_224_small_rollout_hopaware_smoke/mean_flow_224_small_rollout4hop_hopaware_smoke/best.pt
  model:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [384, 2048]
    depth: [12, 2]
    num_heads: [6, 16]
    mlp_ratio: 4.0
  data:
    timepoints: [D50, D20, D10, D4, NORMAL]
    t_map:
      D50: 2.0
      D20: 5.0
      D10: 10.0
      D4: 25.0
      NORMAL: 100.0

rae:
  encoder_config_path: /home/qujiaxiang/project/RAE/dinov2
  encoder_input_size: 224
  dinov2_path: /home/qujiaxiang/project/RAE/dinov2
  encoder_mean: [0.0, 0.0, 0.0]
  encoder_std: [1.0, 1.0, 1.0]
  decoder_config_path: /home/qujiaxiang/project/RAE/vit-mae
  decoder_patch_size: 14
  use_lora: true
  lora_rank: 16
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_keywords:
    - attention.qkv
    - attention.projection
    - attention.attention.query
    - attention.attention.key
    - attention.attention.value
    - attention.output.dense
    - .mlp.fc1
    - .mlp.fc2
  checkpoint_path: /data_2/qujiaxiang/outputs/pet_lora_dinov2_pt_224/best_model.pt

first_hop:
  num_hops: 4
  pixel_encoder_stem_channels: 32
  pixel_encoder_hidden_channels: 64
  hop_residual_hidden_channels: 192
  pixel_gate_init: 3.0e-3
  lambda_hop_init: 3.0e-3
  pixel_proj_init_std: 0.0
  hop_residual_last_init_std: 0.0
  pair_v_std: [0.009634, 0.002946, 0.000775, 0.000141]

loss:
  pair:
    velocity_weight: 1.0
    endpoint_weight: 1.0
    velocity_rebalance:
      enabled: true
      mode: sqrt_ratio
      clip_min: 1.0
      clip_max: 4.0
      eps: 1.0e-12
  image_aux:
    l1_weight: 1.0
    ssim_weight: 0.25
    seam_weight: 0.10
    border_width: 14
    border_weight: 2.0
    seam_patch_size: 14
  regularizer:
    enabled: false
    lambda_hop_l2_weight: 0.0
    gate_pix_l2_weight: 0.0
